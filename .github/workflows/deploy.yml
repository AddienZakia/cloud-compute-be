name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:gen

      - name: Run Typecheck
        run: pnpm run typecheck

  deploy:
    name: Deploy to Server
    needs: typecheck
    runs-on: ubuntu-latest
    environment: server

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            git config --global --add safe.directory /var/www/cloud-be
            cd /var/www/cloud-be
            git pull origin main

            # Build image ONCE — semua service pakai image yang sama
            docker build -t cloud-be-app:latest .

            # Jalankan semua container tanpa rebuild (image sudah ada)
            docker compose up -d --no-build

            # Jalankan migrasi Prisma
            docker compose exec -T api-service pnpm run db:push || true

            # Hapus image lama yang tidak terpakai
            docker image prune -f

